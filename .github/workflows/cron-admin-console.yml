name: Cron — admin console maintenance

# Admin console Phase 0 (docs/ADMIN-CONSOLE-PLAN.md §7.4). Same pattern and
# same reasoning as the other four cron workflows here: Vercel Hobby caps a
# project at 2 cron jobs, so every schedule lives in GitHub Actions instead.
#
# This job does three things, in this order, and the order matters:
#   1. ensureFuturePartitions()      — create platform_events partitions ahead
#   2. computePlatformDailyRollup()  — yesterday's platform_daily_rollups row
#   3. rollUpExpiredPartitions()     — 90-day retention: roll up, then detach
#
# Step 1 is not optional maintenance. `platform_events` is RANGE partitioned
# monthly on created_at with a DEFAULT catch-all partition. If DEFAULT ever
# accumulates rows for a month, creating that month's partition FAILS —
# Postgres scans DEFAULT under an ACCESS EXCLUSIVE lock and errors if any row
# belongs in the incoming range. This job running several months ahead is what
# keeps DEFAULT empty, and an empty DEFAULT is what keeps the next partition
# creatable. If this workflow stops running, that failure is silent until the
# month it bites. See the header comment in
# prisma/migrations/20260909120000_admin_console_phase0/migration.sql for the
# recovery procedure.
#
# NOTE: GitHub only runs scheduled workflows from the repository's DEFAULT
# branch. Until this file is merged to `main`, nothing fires.

on:
  schedule:
    # Daily, 01:30 UTC — half an hour after cron-analytics-rollups so the two
    # daily jobs do not contend for the same Supabase connection pool.
    - cron: "30 1 * * *"
  workflow_dispatch:

concurrency:
  group: cron-admin-console
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Invoke /api/cron/admin-console
        env:
          BASE_URL: ${{ vars.APP_BASE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          [ -n "${BASE_URL:-}" ] || { echo "::error::repository variable APP_BASE_URL is not set"; exit 1; }
          [ -n "${CRON_SECRET:-}" ] || { echo "::error::repository secret CRON_SECRET is not set"; exit 1; }

          code=$(curl -sS -o response.json -w '%{http_code}' \
            --retry 3 --retry-delay 15 --retry-all-errors --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${BASE_URL}/api/cron/admin-console")

          echo "HTTP ${code}"
          cat response.json || true
          echo

          # 503 means CRON_SECRET is missing on the server; 401 means it does
          # not match this workflow's secret. Both are configuration errors
          # worth failing loudly on rather than retrying into silence.
          [ "${code}" = "200" ] || { echo "::error::cron returned HTTP ${code}"; exit 1; }
